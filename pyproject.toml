[project]
name = "plaudius"
version = "0.1.0"
description = "Voice-memo-to-brief pipeline: iPhone Shortcut -> Deepgram -> Claude -> Obsidian vault + ntfy"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.12",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plaudius"]

[tool.pytest.ini_options]
testpaths = ["tests"]
